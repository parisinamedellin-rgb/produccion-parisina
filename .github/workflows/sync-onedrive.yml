name: Publicar web desde Google Drive

# Parisina · Producción
# Toma index.html compartido en Google Drive (carpeta "WEB PRODUCCION"; antes OneDrive) y lo sube al repo SOLO si OneDrive cambió desde la última
# vez que el robot lo subió (huella en .github/ultimo-onedrive.sha256).
# También se puede correr a mano: Actions → este workflow → "Run workflow".

on:
  schedule:
        - cron: '*/15 8-11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar index.html de Google Drive
        run: |
          # Alban 21 oct 2026: fin de la transición, OneDrive queda por fuera. El robot lee el index.html
          # de Google Drive (Mi unidad › La Parisina SAS › Github › WEB PRODUCCION, compartido "cualquiera con el vínculo").
          set +e
          ID='1QZQ32wMs-aXT0f44xeaFiI7pgvP1rIxJ'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64)'
          ok=0
          intentar () {
            echo "== Método $1: $2"
            curl -sSL --retry 2 -A "$UA" -o /tmp/nuevo.html -w 'HTTP %{http_code} bytes %{size_download}\n' "$2"
            if grep -q 'const DATA = ' /tmp/nuevo.html 2>/dev/null && grep -q 'Datos actualizados' /tmp/nuevo.html; then
              echo "   -> OK con método $1"; ok=1; return 0
            fi
            echo "   -> no sirvió (inicio: $(head -c 120 /tmp/nuevo.html 2>/dev/null | tr '\n' ' '))"
            rm -f /tmp/nuevo.html; return 1
          }
          intentar 1 "https://drive.usercontent.google.com/download?id=$ID&export=download&confirm=t" || \
          intentar 2 "https://drive.google.com/uc?export=download&id=$ID&confirm=t"
          set -e
          [ "$ok" = 1 ] || { echo "::error::No se pudo descargar index.html de Google Drive"; exit 1; }
          grep -o 'Datos actualizados: <b[^>]*>[^<]*' /tmp/nuevo.html | sed 's/.*>/Descargado: /'

      - name: Subir al repo si cambió
        run: |
          # Candado (Alban, 11-oct-2026): solo se publica si el archivo de OneDrive CAMBIÓ
          # desde la última vez que el robot lo subió (= la tarea de las 3:22 a.m. corrió).
          # Si no corrió (computador apagado), OneDrive tiene el mismo archivo viejo y NO se sube,
          # así no pisa lo que se haya publicado a mano en GitHub.
          # Al correrlo a mano ("Run workflow") no se exige.
          NUEVO=$(sha256sum /tmp/nuevo.html | cut -d' ' -f1)
          ULTIMO=$(cat .github/ultimo-onedrive.sha256 2>/dev/null)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$NUEVO" = "$ULTIMO" ]; then
            echo "::warning::Google Drive no cambió desde la última publicación del robot (la tarea de las 2:44 no corrió). NO se publica: la web se queda como está."
            exit 0
          fi
          echo "$NUEVO" > .github/ultimo-onedrive.sha256
          git add .github/ultimo-onedrive.sha256
          if cmp -s /tmp/nuevo.html index.html; then
            echo "Sin cambios: la web ya tiene esta versión."
            git config user.name "Parisina bot"
            git config user.email "actions@users.noreply.github.com"
            git diff --cached --quiet || { git commit -m "Robot: recordar último archivo de OneDrive"; git push; }
            exit 0
          fi
          cp /tmp/nuevo.html index.html
          FECHA=$(grep -o 'Datos actualizados: <b[^>]*>[^<]*' index.html | sed 's/.*>//')
          git config user.name "Parisina bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Datos actualizados: $FECHA"
          git push
          echo "Publicado: $FECHA"
