name: Publicar web desde OneDrive

# Parisina · Producción
# Todos los días a las 3:44 a.m. (Medellín) toma index.html compartido en OneDrive
# (carpeta "WEB PRODUCCION") y lo sube al repo si cambió y si trae la marca de hoy
# (onedrive-publicado: AAAA-MM-DD) que deja la tarea de las 3:22 a.m.
# También se puede correr a mano: Actions → este workflow → "Run workflow".

on:
  schedule:
    - cron: '44 8 * * *'   # 08:44 UTC = 3:44 a.m. Bogotá
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar index.html de OneDrive
        run: |
          set +e
          LINK='https://1drv.ms/u/c/6ab1f215578ef6c1/IQD6YaM6iPODQrEaZ-X9008gAdnWTiYQ6pzi37vDFmKfjHg?e=fRhrxS'
          CID='6ab1f215578ef6c1'
          TOKEN='IQD6YaM6iPODQrEaZ-X9008gAdnWTiYQ6pzi37vDFmKfjHg'
          ENC=$(printf '%s' "$LINK" | base64 -w0 | tr '+/' '-_' | tr -d '=')
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64)'
          ok=0
          intentar () {
            echo "== Método $1: $2"
            curl -sSL --retry 2 -A "$UA" -o /tmp/nuevo.html -w 'HTTP %{http_code} bytes %{size_download} final %{url_effective}\n' "$2"
            if grep -q 'const DATA = ' /tmp/nuevo.html 2>/dev/null && grep -q 'Datos actualizados' /tmp/nuevo.html; then
              echo "   -> OK con método $1"; ok=1; return 0
            fi
            echo "   -> no sirvió (inicio: $(head -c 120 /tmp/nuevo.html 2>/dev/null | tr '\n' ' '))"
            rm -f /tmp/nuevo.html; return 1
          }
          intentar 1 "https://my.microsoftpersonalcontent.com/personal/$CID/_layouts/15/download.aspx?share=$TOKEN" || \
          intentar 2 "${LINK}&download=1" || \
          intentar 3 "https://api.onedrive.com/v1.0/shares/u!$ENC/root/content" || \
          intentar 4 "https://onedrive.live.com/download?resid=$CID&share=$TOKEN"
          if [ "$ok" != 1 ]; then
            FINAL=$(curl -sSL -A "$UA" -o /dev/null -w '%{url_effective}' "$LINK")
            echo "URL final del link: $FINAL"
            intentar 5 "$(echo "$FINAL" | sed 's#onedrive\.aspx#download.aspx#')"
          fi
          set -e
          [ "$ok" = 1 ] || { echo "::error::No se pudo descargar index.html de OneDrive"; exit 1; }
          grep -o 'Datos actualizados: <b[^>]*>[^<]*' /tmp/nuevo.html | sed 's/.*>/Descargado: /'

      - name: Subir al repo si cambió
        run: |
          # Candado (Alban, 11-oct-2026): solo se publica si la tarea de las 3:22 a.m. corrió HOY.
          # Esa tarea deja al final del index.html la marca <!-- onedrive-publicado: AAAA-MM-DD -->.
          # Si no corrió (computador apagado), OneDrive tiene el archivo viejo y NO se sube.
          # Al correrlo a mano ("Run workflow") no se exige la marca.
          HOY=$(TZ=America/Bogota date +%F)
          MARCA=$(grep -o 'onedrive-publicado: [0-9-]*' /tmp/nuevo.html | tail -1 | awk '{print $2}')
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$MARCA" != "$HOY" ]; then
            echo "::warning::La tarea de las 3:22 no corrió hoy ($HOY). Marca en OneDrive: ${MARCA:-ninguna}. NO se publica: la web se queda como está."
            exit 0
          fi
          if cmp -s /tmp/nuevo.html index.html; then
            echo "Sin cambios: la web ya tiene esta versión."
            exit 0
          fi
          cp /tmp/nuevo.html index.html
          FECHA=$(grep -o 'Datos actualizados: <b[^>]*>[^<]*' index.html | sed 's/.*>//')
          git config user.name "Parisina bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Datos actualizados: $FECHA"
          git push
          echo "Publicado: $FECHA"
